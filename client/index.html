<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0e1716" />
    <meta name="description" content="Synthia AI — an autonomous agent workspace with complete task visibility." />
    <title>Synthia AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      #synthia-bootstrap { min-height: 100vh; display: grid; place-items: center; margin: 0; background: radial-gradient(circle at 50% 0%, rgba(20,184,166,.22), transparent 38%), #0e1716; color: #eaf8f5; font-family: Manrope, system-ui, sans-serif; }
      #synthia-bootstrap-card { width: min(410px, calc(100vw - 48px)); border: 1px solid rgba(185,244,235,.14); border-radius: 22px; background: rgba(20,33,31,.92); padding: 32px; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      #synthia-bootstrap-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(135deg,#2dd4bf,#67e8f9); color: #06211e; font-weight: 800; }
      #synthia-bootstrap h1 { margin: 18px 0 8px; font-size: 27px; line-height: 1.15; }
      #synthia-bootstrap p { margin: 0; color: #c3b4a6; font-size: 14px; line-height: 1.55; }
    </style>
  </head>
  <body>
    <div id="root"><div id="synthia-bootstrap" role="status" aria-live="polite"><div id="synthia-bootstrap-card"><div id="synthia-bootstrap-mark">S</div><h1 id="synthia-bootstrap-title">Opening Synthia AI</h1><p id="synthia-bootstrap-message">Loading your autonomous agent workspace. If this message remains visible, reload the preview to refresh its secure client session.</p></div></div></div>
    <script>
      window.setTimeout(function () {
        var title = document.getElementById('synthia-bootstrap-title');
        var message = document.getElementById('synthia-bootstrap-message');
        if (title) title.textContent = 'Preparing secure workspace';
        if (message) message.textContent = 'The browser is running Synthia AI checks. If this message remains visible, this browser is blocking the application module.';
      }, 1200);
    </script>
    <script defer src="/synthia-preview.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
